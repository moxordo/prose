name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build, test, bundle (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test (offline suite)
        run: swift test

      - name: Bundle Prose.app (ad-hoc signed on CI)
        run: scripts/bundle.sh release

      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          plist="dist/Prose.app/Contents/Info.plist"
          v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Info.plist $v != tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Prose.app-${{ github.sha }}
          path: dist/Prose.app
          if-no-files-found: error
